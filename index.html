<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panazea - En construcción</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      color: #f0f0f0;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      padding: 1.5rem 1rem;
    }
    nav a {
      color: #f0f0f0;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.75;
      transition: opacity 0.2s ease;
    }
    nav a:hover {
      opacity: 1;
    }
    img {
      max-width: 85%;
      max-height: 65vh;
      margin-bottom: 1rem;
    }
    p {
      opacity: 0.75;
      margin-top: 0.6rem;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#">Quiénes somos</a>
    <a href="#">Nuestra música</a>
    <a href="#">Contacto</a>
  </nav>
  <img src="LogoIndex.png" alt="Logo de Panazea">
  <p>Próximamente...</p>
</body>
</html>
